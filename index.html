<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff3f7"><link rel="apple-touch-icon" href="4.PNG"><title>うめこ流・数秘のトリセツ</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:radial-gradient(circle at top,#ffe3f0,#fff9f4 55%,#f6f0ff);color:#49323e;min-height:100vh}.wrap{max-width:540px;margin:auto;padding:28px 18px 55px}.panel{background:#ffffffd9;border:1px solid #fff;border-radius:24px;box-shadow:0 12px 40px #a75b7b1a;padding:24px 18px;text-align:center}h1{font-size:25px;margin:8px 0 8px}p{line-height:1.65}.sub{font-size:13px;color:#846775;margin-bottom:25px}label{display:block;font-weight:700;margin:18px 0 8px}input{font-size:18px;padding:14px 12px;border-radius:12px;border:1px solid #d7b9c8;width:100%;max-width:320px;background:white;color:#49323e}button{border:0;border-radius:99px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;background:#d64e83;color:white;width:100%;max-width:320px;margin-top:17px}.secondary{background:#78618f}.result{display:none;margin-top:22px}.num{font-size:44px;font-weight:900;color:#c63e76;margin:6px 0}.small{font-size:13px;color:#765c69}.result img{width:100%;height:auto;display:block;margin:18px auto 8px;border-radius:14px}.error{color:#a62f50;font-weight:700}footer{font-size:11px;color:#8a7480;text-align:center;margin-top:22px}</style></head><body><main class="wrap"><section class="panel"><div style="font-size:29px">🐱✨</div><h1>うめこ流・数秘のトリセツ</h1><p class="sub">誕生日から、あんたの数字をのぞいてみよか。</p><form id="form"><label for="birth">生年月日を入れてな 🎂</label><input id="birth" type="date" required><button type="submit">トリセツを見てみる 😈</button></form><div id="result" class="result" aria-live="polite"><div class="small">あんたの複合数は…</div><div id="number" class="num"></div><div id="reduced" class="small"></div><p id="message"></p><img id="card" alt="数秘のトリセツ画像" hidden><p id="hint" class="small" hidden>画像を長押しして保存してな 📱</p><button id="again" class="secondary" type="button">別の誕生日も見る</button></div></section><footer>© うめこ屋｜数秘は自己理解を楽しむためのものです。</footer></main><script>const form=document.getElementById('form'),birth=document.getElementById('birth'),result=document.getElementById('result'),number=document.getElementById('number'),reduced=document.getElementById('reduced'),message=document.getElementById('message'),card=document.getElementById('card'),hint=document.getElementById('hint');function reduce(n){while(n>9&&![11,22,33,44].includes(n))n=String(n).split('').reduce((a,b)=>a+Number(b),0);return n}form.addEventListener('submit',e=>{e.preventDefault();if(!birth.value)return;const digits=birth.value.replace(/\D/g,'');const total=[...digits].reduce((s,d)=>s+Number(d),0);number.textContent=total;reduced.textContent='還元数：'+reduce(total);result.style.display='block';card.hidden=true;hint.hidden=true;card.removeAttribute('src');if(total<4||total>48){message.textContent='この複合数（'+total+'）の画像は、今の4.PNG〜48.PNGには含まれてへんで。';return}message.textContent='あんたのトリセツ、こちら！';card.onload=()=>{card.hidden=false;hint.hidden=false};card.onerror=()=>{card.hidden=true;hint.hidden=true;message.textContent='画像「'+total+'.PNG」が見つからへん。index.htmlと同じ場所にあるか、大文字・小文字を確認してな。'};card.src='./'+total+'.PNG'});document.getElementById('again').addEventListener('click',()=>{birth.value='';result.style.display='none';birth.focus();window.scrollTo({top:0,behavior:'smooth'})});</script></body></html>

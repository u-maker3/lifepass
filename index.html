<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff3f7"><link rel="icon" type="image/png" href="./icon.PNG?v=2"><link rel="apple-touch-icon" sizes="180x180" href="./icon.PNG?v=2"><title>うめこ流・数秘のトリセツ</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:radial-gradient(circle at top,#ffe3f0,#fff9f4 55%,#f6f0ff);color:#49323e;min-height:100vh}.wrap{max-width:540px;margin:auto;padding:28px 18px 55px}.panel{background:#ffffffd9;border:1px solid #fff;border-radius:24px;box-shadow:0 12px 40px #a75b7b1a;padding:24px 18px;text-align:center}h1{font-size:25px;margin:8px 0 8px}p{line-height:1.65}.sub{font-size:13px;color:#846775;margin-bottom:25px}label{display:block;font-weight:700;margin:18px 0 8px}input{font-size:18px;padding:14px 12px;border-radius:12px;border:1px solid #d7b9c8;width:100%;max-width:320px;background:white;color:#49323e}button{border:0;border-radius:99px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;background:#d64e83;color:white;width:100%;max-width:320px;margin-top:17px}.secondary{background:#78618f}.result{display:none;margin-top:22px}.num{font-size:44px;font-weight:900;color:#c63e76;margin:6px 0}.small{font-size:13px;color:#765c69}.result img{width:100%;height:auto;display:block;margin:18px auto 8px;border-radius:14px}.error{color:#a62f50;font-weight:700}.tabs{display:flex;gap:7px;margin:18px 0 12px}.tabs button{flex:1;min-width:0;padding:11px 5px;margin:0;font-size:14px;background:#eee3ec;color:#654657}.tabs button.active{background:#d64e83;color:white}.reading{text-align:left;white-space:pre-wrap;line-height:1.85;background:#fffafc;border:1px solid #f2dce6;border-radius:14px;padding:16px 14px;margin-top:12px;font-size:15px;overflow-wrap:anywhere}.reading[hidden],.imageview[hidden]{display:none!important}.credit{font-size:11px;line-height:1.7;color:#846775;margin-top:20px}footer{font-size:11px;color:#8a7480;text-align:center;margin-top:22px}</style></head><body><main class="wrap"><section class="panel"><div style="font-size:29px">🐱✨</div><h1>うめこ流・数秘のトリセツ</h1><p class="sub">誕生日から、あんたの数字をのぞいてみよか。</p><form id="form"><label for="birth">生年月日を入れてな 🎂</label><input id="birth" type="date" required><button type="submit">トリセツを見てみる 😈</button></form><div id="result" class="result" aria-live="polite"><div class="small">あんたの複合数は…</div><div id="number" class="num"></div><div id="reduced" class="small"></div><p id="message"></p><div class="tabs" role="tablist" aria-label="表示切り替え"><button type="button" class="active" data-tab="image" aria-selected="true">画像</button><button type="button" data-tab="full" aria-selected="false">全文</button><button type="button" data-tab="notes" aria-selected="false">研究メモ</button></div><div id="imageview" class="imageview"><img id="card" alt="数秘のトリセツ画像" hidden><p id="hint" class="small" hidden>画像を長押しして保存してな 📱</p></div><div id="fullview" class="reading" hidden></div><div id="notesview" class="reading" hidden></div><button id="again" class="secondary" type="button">別の誕生日も見る</button></div></section><footer>© 2026 うめこ屋｜数秘は自己理解を楽しむためのものです。<div class="credit">本コンテンツは数秘術を参考に、うめこ流の独自解釈と表現を加えて制作しています。文章・イラスト等の創作的表現の無断転載・複製・再配布・商用利用はご遠慮ください。数秘術の計算方法や一般的な理論自体について独占的な権利を主張するものではありません。</div></footer></main><script>const form=document.getElementById('form'),birth=document.getElementById('birth'),result=document.getElementById('result'),number=document.getElementById('number'),reduced=document.getElementById('reduced'),message=document.getElementById('message'),card=document.getElementById('card'),hint=document.getElementById('hint');let manuscripts={};fetch('./manuscripts.json?v=20261028-45',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('not found');return r.json()}).then(data=>{manuscripts=data; if(currentTotal!==null)renderManuscript()}).catch(err=>{console.error('原稿データの読み込みに失敗:',err);manuscripts={};});let currentTotal=null;const fullview=document.getElementById('fullview'),notesview=document.getElementById('notesview');function renderManuscript(){const item=manuscripts[String(currentTotal)];fullview.textContent=item&&item.full?item.full:'この数字の全文原稿は、まだアプリに収録されてへんで。原文を manuscripts.json に追加してな。';notesview.textContent=item&&item.notes?item.notes:'この数字の研究メモは、まだアプリに収録されてへんで。原文を manuscripts.json に追加してな。'}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{const tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-selected',String(x===b))});document.getElementById('imageview').hidden=tab!=='image';fullview.hidden=tab!=='full';notesview.hidden=tab!=='notes'}));function reduce(n){while(n>9&&![11,22,33,44].includes(n))n=String(n).split('').reduce((a,b)=>a+Number(b),0);return n}form.addEventListener('submit',e=>{e.preventDefault();if(!birth.value)return;const digits=birth.value.replace(/\D/g,'');const total=[...digits].reduce((s,d)=>s+Number(d),0);currentTotal=total;renderManuscript();number.textContent=total;reduced.textContent='還元数：'+reduce(total);result.style.display='block';document.querySelector('[data-tab=image]').click();card.hidden=true;hint.hidden=true;card.removeAttribute('src');if(total<4||total>48){message.textContent='この複合数（'+total+'）の画像は、今の4.PNG〜48.PNGには含まれてへんで。';return}message.textContent='あんたのトリセツ、こちら！';card.onload=()=>{card.hidden=false;hint.hidden=false};card.onerror=()=>{card.hidden=true;hint.hidden=true;message.textContent='画像「'+total+'.PNG」が見つからへん。index.htmlと同じ場所にあるか、大文字・小文字を確認してな。'};card.src='./'+total+'.PNG'});document.getElementById('again').addEventListener('click',()=>{birth.value='';result.style.display='none';birth.focus();window.scrollTo({top:0,behavior:'smooth'})});</script></body></html>
